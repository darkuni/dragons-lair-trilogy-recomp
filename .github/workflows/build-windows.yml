name: Build Windows

# Every push to main builds the Windows package (download it from the run's "Artifacts").
# Publishing a GitHub Release (or pushing a v* tag) builds it and attaches the zip to the release.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (mingw-w64 posix threads, CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 g++-mingw-w64-x86-64-posix cmake ninja-build zip libsdl2-dev libgl-dev

      - name: SDL2 (mingw development package)
        run: |
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz
          tar xf sdl.tgz

      - name: Build
        working-directory: src
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=mingw.cmake -DSDL2_DIR=$GITHUB_WORKSPACE/SDL2-2.30.9/x86_64-w64-mingw32
          ninja -C build-win -j3

      - name: Build (Linux / SteamOS, SDL2 + OpenGL)
        working-directory: src
        run: |
          cmake -S . -B build-linux -G Ninja -DUSE_SDL=ON -DCMAKE_BUILD_TYPE=Release
          ninja -C build-linux -j3

      - name: Package
        run: |
          V=${GITHUB_REF_NAME}
          [[ "$GITHUB_REF" == refs/tags/* ]] || V=dev-${GITHUB_SHA::7}
          P=DLTrilogy
          mkdir -p pkg/$P
          cp src/build-win/dltrilogy.exe SDL2-2.30.9/x86_64-w64-mingw32/bin/SDL2.dll \
             /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll src/runtime/ipl-font-licenses.txt \
             dist/README.txt LICENSE THIRD_PARTY_NOTICES.md src/redfix/COPYING.LGPLv2.1 pkg/$P/
          sed -i "s/@VERSION@/$V/" pkg/$P/README.txt
          (cd pkg && zip -qr ../DLTrilogy-$V-win64.zip $P)
          echo "ZIP=DLTrilogy-$V-win64.zip" >> $GITHUB_ENV
          L=pkg-linux/DLTrilogy
          mkdir -p $L
          cp src/build-linux/dltrilogy src/runtime/ipl-font-licenses.txt dist/README-linux.txt \
             LICENSE THIRD_PARTY_NOTICES.md src/redfix/COPYING.LGPLv2.1 $L/
          sed -i "s/@VERSION@/$V/" $L/README-linux.txt
          chmod +x $L/dltrilogy
          tar -C pkg-linux -czf DLTrilogy-$V-linux-x86_64.tar.gz DLTrilogy
          echo "TGZ=DLTrilogy-$V-linux-x86_64.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TGZ }}
          path: ${{ env.TGZ }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.TGZ }}
          generate_release_notes: true
